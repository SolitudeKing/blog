# 承接外层边缘代理的 X-Forwarded-Proto：未知值或缺失时回退到本机 $scheme，
# 让 /healthz 等路径在 HTTPS 终止于边缘代理时也能正确识别协议。
map $http_x_forwarded_proto $fwd_proto {
  default $scheme;
  "~*^(http|https)$" $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # 与后台媒体上传能力保持一致，避免 Nginx 使用 1MB 默认限制。
  client_max_body_size 20m;

  # 强制运行时 DNS 解析：literal `api` 在 nginx 启动时被解析并永久缓存，
  # `docker compose restart api` 后容器拿到新 IP 会导致持续 502。借助 Docker
  # 内置 DNS 127.0.0.11 + 变量 proxy_pass 让 nginx 每次新建连接时重新解析。
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # 启用 HTTP/1.1 与 keepalive，配合显式时间兜底 Go 端可能的长请求。
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
  proxy_request_buffering on;

  # 安全头：边缘代理终止 TLS，这里只设与协议无关的项。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # 静态资源压缩：nginx 官方镜像默认未开启 gzip，Vite 产物体积偏大时收益明显。
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml application/xml;

  # nginx 容器自身 liveness：返回 200 纯文本，不穿透到 api / DB，
  # 避免 DB 抖动被外部 LB / orchestrator 误判为 nginx 故障。
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  # 哈希命名的 Vite 产物：一年 immutable，命中后不再请求服务器。
  # 注意：内层 add_header 不会继承外层的安全头，所以这里把四行安全头重写一次。
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # SPA 入口：始终 no-cache，保证新版本发布后用户能拿到最新 index.html。
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /healthz {
    proxy_pass $api_upstream;
  }

  location = /rss.xml {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /sitemap.xml {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ~ ^/(auth|user|setting|article|topic|tag|asset|notice|dashboard|search|uploads)/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
  }
}
