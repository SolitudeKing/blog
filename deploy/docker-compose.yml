x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    container_name: solitude-blog-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *service-logging

  redis:
    image: redis:7.4-alpine
    container_name: solitude-blog-redis
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
      redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *service-logging

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: solitude-blog-api
    env_file:
      - ../.env
    environment:
      STORAGE_LOCAL_ROOT: /app/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - api-storage:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *service-logging

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: solitude-blog-worker
    env_file:
      - ../.env
    environment:
      STORAGE_LOCAL_ROOT: /app/storage/uploads
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - api-storage:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping --timeout=5 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *service-logging

  nginx:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: solitude-blog-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *service-logging

volumes:
  mysql-data:
  redis-data:
  api-storage:
