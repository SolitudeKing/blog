x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: solitude-blog-api
    restart: unless-stopped
    environment:
      # 容器内 API 固定监听 8080；APP_PORT 只作为宿主机调试端口。
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      APP_API_VERSION: ${APP_API_VERSION:-v1}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost}
      # MySQL / Redis 均假设由外部服务提供，Compose 仅透传连接信息。
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USER: ${REDIS_USER:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      MYSQL_TLS: ${MYSQL_TLS:-false}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-Solitude King}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # 容器内 API 写入路径固定在 /app/storage/uploads（与 api-storage 卷对齐）；
      # 宿主机侧的 .env 仅在回退到本地非容器运行时才有意义。
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-/app/storage/uploads}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-false}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - api-storage:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *service-logging

  nginx:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: solitude-blog-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *service-logging

volumes:
  api-storage: